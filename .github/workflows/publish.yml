name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the package into an isolated environment
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install --quiet --upgrade pip
          /tmp/sbom-env/bin/pip install --quiet .
      - name: Generate CycloneDX SBOM
        run: |
          pip install --quiet "cyclonedx-py==1.0.1"
          cyclonedx-py environment /tmp/sbom-env --output-format json --output-file cyphera-python-sbom.cdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: cyphera-python-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: cyphera-python-sbom.*.json
